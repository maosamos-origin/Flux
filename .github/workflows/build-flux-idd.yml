name: Build Flux IddCx ARM64 driver

on:
  workflow_dispatch:
  push:
    paths:
      - 'Guest/Windows/FluxIdd/**'
      - 'Guest/Windows/Tools/**'
      - '.github/workflows/build-flux-idd.yml'
  pull_request:
    paths:
      - 'Guest/Windows/FluxIdd/**'
      - 'Guest/Windows/Tools/**'
      - '.github/workflows/build-flux-idd.yml'

jobs:
  build-arm64:
    name: Build ARM64 UMDF IddCx package
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect Visual Studio ARM64 component inventory
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found: $vswhere" }
          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsInstallPath -or -not (Test-Path $vsInstallPath)) { throw 'Visual Studio installation with MSBuild was not found.' }
          $arm64Component = 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          $arm64InstalledPath = & $vswhere -latest -products * -requires $arm64Component -property installationPath
          Write-Host "Visual Studio installation: $vsInstallPath"
          Write-Host "Required ARM64 component: $arm64Component"
          Write-Host "ARM64 component already installed: $([bool]$arm64InstalledPath)"
          "VS_INSTALL_PATH=$vsInstallPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARM64_MSVC_COMPONENT=$arm64Component" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Windows 11 26H1 SDK and WDK for VS18 IddCx
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --exact --id Microsoft.WindowsSDK.10.0.28000 --source winget --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
          winget install --exact --id Microsoft.WindowsWDK.10.0.28000 --source winget --silent --disable-interactivity --accept-package-agreements --accept-source-agreements

      - name: Install MSVC ARM64 cross tools
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -latest -products * -requires $env:ARM64_MSVC_COMPONENT -property installationPath
          if (-not $installed) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            if (-not (Test-Path $installer)) { throw "Visual Studio Installer was not found: $installer" }
            & $installer modify --installPath $env:VS_INSTALL_PATH --add $env:ARM64_MSVC_COMPONENT --quiet --wait --norestart
            if ($LASTEXITCODE -ne 0) { throw "Visual Studio ARM64 component installation failed with exit code $LASTEXITCODE." }
          }
          $installed = & $vswhere -latest -products * -requires $env:ARM64_MSVC_COMPONENT -property installationPath
          if (-not $installed) { throw "Required Visual Studio component was not installed: $env:ARM64_MSVC_COMPONENT" }
          Write-Host "ARM64 MSVC component installed in: $installed"

      - name: Audit Visual Studio, SDK, WDK, and IddCx inputs
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== Windows ==='
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | Format-List
          Write-Host '=== Visual Studio instances ==='
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found: $vswhere" }
          & $vswhere -all -products * -format json
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) { throw 'Visual Studio x64 MSBuild was not found.' }
          if ($msbuild -notmatch '\\MSBuild\\Current\\Bin\\amd64\\MSBuild\.exe$') { throw "Selected MSBuild is not x64: $msbuild" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $msbuild -version
          Write-Host '=== Windows SDK directories ==='
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Select-Object FullName
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Directory | Select-Object FullName
          Write-Host '=== WDK directories ==='
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Force | Select-Object Name, FullName
          Write-Host '=== Installed WDK ==='
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -match 'Windows Driver Kit' } |
            Select-Object DisplayName, DisplayVersion, InstallLocation | Format-List
          $iddcxHeader = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Recurse -Filter iddcx.h -ErrorAction SilentlyContinue | Select-Object -First 1
          $iddcxLib = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Recurse -Filter IddCxStub.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\arm64\\' } | Select-Object -First 1
          $driverKitTasks = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\build" -Recurse -Filter Microsoft.DriverKit.Build.Tasks.18.0.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iddcxHeader) { throw 'iddcx.h was not found in the installed SDK/WDK.' }
          if (-not $iddcxLib) { throw 'ARM64 IddCxStub.lib was not found in the installed SDK/WDK.' }
          if (-not $driverKitTasks) { throw 'Microsoft.DriverKit.Build.Tasks.18.0.dll was not found in the installed WDK.' }
          "IDDCX_HEADER=$($iddcxHeader.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IDDCX_LIB=$($iddcxLib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DRIVERKIT_TASKS_18=$($driverKitTasks.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "iddcx.h: $($iddcxHeader.FullName)"
          Write-Host "IddCxStub.lib: $($iddcxLib.FullName)"
          $wdkBuildRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\build\10.0.28000.0"
          $wdkToolsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Tools\10.0.28000.0"
          $infVerifExe = "$wdkToolsRoot\x64\infverif.exe"
          $infVerifDll = "$wdkBuildRoot\bin\x64\infverif.dll"
          $infVerifHlkDll = "$wdkBuildRoot\bin\x64\infverifhlk.dll"
          $packageVerifierTasks = "$wdkBuildRoot\bin\Microsoft.DriverKit.Build.Tasks.PackageVerifier.18.0.dll"
          @($infVerifExe,$infVerifDll,$infVerifHlkDll,$driverKitTasks.FullName,$packageVerifierTasks) | ForEach-Object { if (-not (Test-Path $_)) { throw "Required WDK runtime file was not found: $_" } }
          Write-Host "x64 InfVerif.exe: $infVerifExe"
          Write-Host "x64 InfVerif.dll: $infVerifDll"
          Write-Host "x64 InfVerifHLK.dll: $infVerifHlkDll"
          Write-Host "DriverKit Build Tasks 18: $($driverKitTasks.FullName)"
          Write-Host "PackageVerifier Tasks 18: $packageVerifierTasks"
          $commonTargets = Join-Path (Split-Path (Split-Path $driverKitTasks.FullName -Parent) -Parent) 'WindowsDriver.common.targets'
          if (-not (Test-Path $commonTargets)) { throw "WindowsDriver.common.targets was not found: $commonTargets" }
          $taskAssemblyDirectory = Split-Path $driverKitTasks.FullName -Parent
          Write-Host "=== DriverKit task assembly directory: $taskAssemblyDirectory ==="
          Get-ChildItem $taskAssemblyDirectory -Force | ForEach-Object { Write-Host $_.FullName }
          Write-Host '=== Immediate DriverKit task architecture subdirectories ==='
          Get-ChildItem $taskAssemblyDirectory -Directory -Force | ForEach-Object {
            Write-Host "--- $($_.FullName) ---"
            Get-ChildItem $_.FullName -Force | ForEach-Object { Write-Host $_.FullName }
          }
          Write-Host '=== WindowsDriver.common.targets lines 680-720 ==='
          (Get-Content $commonTargets | Select-Object -Skip 679 -First 41) | ForEach-Object { Write-Host $_ }
          Write-Host '=== All InfVerif references in WindowsDriver.common.targets ==='
          Select-String -Path $commonTargets -Pattern 'InfVerif|InfVerif.dll|RunInfVerif' | ForEach-Object { Write-Host "line $($_.LineNumber): $($_.Line.Trim())" }
          $validateUsingTask = Select-String -Path $commonTargets -Pattern 'ValidateNTTargetVersion|Microsoft.DriverKit.Build.Tasks.18.0.dll' | Select-Object -First 1
          if (-not $validateUsingTask) { throw "ValidateNTTargetVersion UsingTask declaration was not found: $commonTargets" }
          Write-Host "ValidateNTTargetVersion UsingTask: $($validateUsingTask.Line.Trim())"
          $arm64Compiler = Get-ChildItem "$env:VS_INSTALL_PATH\VC\Tools\MSVC" -Recurse -Filter cl.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Hostx64\\arm64\\cl.exe$' } | Select-Object -First 1
          if (-not $arm64Compiler) { throw 'MSVC Hostx64/arm64 compiler was not found.' }
          Write-Host "ARM64 compiler: $($arm64Compiler.FullName)"
          $compilerInfo = (Get-Item $arm64Compiler.FullName).VersionInfo
          Write-Host "ARM64 compiler FileVersion: $($compilerInfo.FileVersion)"
          Write-Host "ARM64 compiler ProductVersion: $($compilerInfo.ProductVersion)"
          $arm64MsvcLib = Get-ChildItem "$env:VS_INSTALL_PATH\VC\Tools\MSVC" -Directory |
            ForEach-Object { Join-Path $_.FullName 'lib\arm64' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $arm64MsvcLib) { throw 'MSVC ARM64 library directory was not found.' }
          Write-Host "ARM64 MSVC libraries: $arm64MsvcLib"

      - name: Build ARM64 FluxDevNode helper and preserve full log
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .artifacts\Tools\FluxDevNode | Out-Null
          $toolsOut = (Resolve-Path .artifacts\Tools\FluxDevNode).Path
          & .\Guest\Windows\Tools\FluxDevNode\build-flux-devnode.ps1 -Configuration Release -Platform ARM64 -OutputDir $toolsOut 2>&1 |
            Tee-Object -FilePath .artifacts\Tools\build-flux-devnode.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug ARM64 driver and preserve full log
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path .artifacts\FluxIdd | Out-Null
          & $env:MSBUILD Guest\Windows\FluxIdd\FluxIdd.sln /m /p:Configuration=Debug /p:Platform=ARM64 2>&1 |
            Tee-Object -FilePath .artifacts\FluxIdd\msbuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate ARM64 result and INF
        run: |
          $ErrorActionPreference = 'Stop'
          $driverRoot = 'Guest\Windows\FluxIdd'
          $dll = Get-ChildItem $driverRoot -Recurse -Filter FluxIdd.dll | Select-Object -First 1
          if (-not $dll) { throw 'FluxIdd.dll was not produced by the ARM64 build.' }
          $stampedInf = Join-Path $driverRoot 'ARM64\Debug\FluxIdd.inf'
          if (-not (Test-Path $stampedInf)) { throw "Stamped INF was not produced: $stampedInf" }
          Write-Host "Selected stamped INF: $stampedInf"
          $dumpbins = Get-ChildItem $env:VS_INSTALL_PATH -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue
          Write-Host 'Available dumpbin.exe paths:'
          $dumpbins | ForEach-Object { Write-Host $_.FullName }
          $dumpbin = $dumpbins | Sort-Object @{ Expression = { if ($_.FullName -match '\\Hostx64\\x64\\dumpbin.exe$') { 0 } else { 1 } } }, FullName | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found for binary architecture validation.' }
          Write-Host "Selected dumpbin.exe: $($dumpbin.FullName)"
          & $dumpbin.FullName /headers $dll.FullName 2>&1 | Tee-Object -FilePath .artifacts\FluxIdd\dumpbin-headers.log
          if (-not ((Get-Content .artifacts\FluxIdd\dumpbin-headers.log -Raw) -match 'ARM64')) { throw 'FluxIdd.dll is not ARM64.' }
          $infVerif = Join-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Tools\10.0.28000.0\x64" 'infverif.exe'
          if (-not (Test-Path $infVerif)) { throw "x64 InfVerif.exe was not found: $infVerif" }
          Write-Host "Selected InfVerif.exe: $infVerif"
          & $infVerif /v $stampedInf 2>&1 | Tee-Object -FilePath .artifacts\FluxIdd\infverif.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ((Get-Content $stampedInf -Raw) -match 'ROOT\\FLUX_IDD')) { throw 'ROOT\\FLUX_IDD binding was not preserved.' }

      - name: Build ARM64 devcon and preserve full log
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .artifacts\Tools | Out-Null
          $toolsOut = (Resolve-Path .artifacts\Tools).Path
          & .\Guest\Windows\Tools\devcon\build-devcon.ps1 -Configuration Release -Platform ARM64 -OutputDir $toolsOut 2>&1 |
            Tee-Object -FilePath .artifacts\Tools\build-devcon.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect driver package from the single WDK package directory
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg  = 'Guest\Windows\FluxIdd\ARM64\Debug\FluxIdd'
          $dest = '.artifacts\FluxIdd\package'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Write-Host "Package source directory: $pkg"
          if (-not (Test-Path -LiteralPath $pkg)) { throw "Package directory missing: $pkg" }
          Get-ChildItem -LiteralPath $pkg -Force | Format-Table Name, Length, LastWriteTime | Out-String | Write-Host
          foreach ($n in 'FluxIdd.inf','FluxIdd.dll','FluxIdd.cat') {
            $src = Join-Path $pkg $n
            if (-not (Test-Path -LiteralPath $src)) { throw "Required package file missing: $src" }
            Copy-Item -LiteralPath $src -Destination $dest -Force
          }

          $symDir = '.artifacts\FluxIdd\symbols'
          New-Item -ItemType Directory -Force -Path $symDir | Out-Null
          $pdb = Join-Path $pkg 'FluxIdd.pdb'
          if (Test-Path -LiteralPath $pdb) {
            Copy-Item -LiteralPath $pdb -Destination $symDir -Force
          } else {
            Write-Host 'FluxIdd.pdb not in package directory (diagnostic only, not required).'
          }

      - name: Validate packaged artifact (INF, DLL, CAT coherence)
        run: |
          $ErrorActionPreference = 'Continue'
          $pkgSrc = 'Guest\Windows\FluxIdd\ARM64\Debug\FluxIdd'
          $d   = '.artifacts\FluxIdd\package'
          $inf = Join-Path $d 'FluxIdd.inf'
          $dll = Join-Path $d 'FluxIdd.dll'
          $cat = Join-Path $d 'FluxIdd.cat'

          foreach ($f in @($inf,$dll,$cat)) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing artifact file: $f" }
          }

          function Find-Tool($name) {
            foreach ($r in @("${env:ProgramFiles(x86)}\Windows Kits\10\bin", "${env:ProgramFiles(x86)}\Windows Kits\10\Tools")) {
              if (Test-Path $r) {
                $f = Get-ChildItem $r -Recurse -Filter $name -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match '\\x64\\' } |
                     Sort-Object FullName -Descending |
                     Select-Object -First 1
                if ($f) { return $f.FullName }
              }
            }
            throw "$name not found in Windows Kits"
          }

          function Run-Strict($label, $exe, $argList) {
            $o = & $exe @argList 2>&1
            $code = $LASTEXITCODE
            Write-Host "== $label (exit $code) =="
            ($o | Out-String) | Write-Host
            if ($code -ne 0) { throw "$label FAILED (exit $code)" }
          }

          foreach ($n in 'FluxIdd.inf','FluxIdd.dll','FluxIdd.cat') {
            $a = (Get-FileHash -LiteralPath (Join-Path $d $n) -Algorithm SHA256).Hash
            $b = (Get-FileHash -LiteralPath (Join-Path $pkgSrc $n) -Algorithm SHA256).Hash
            Write-Host "$n artifact=$a source-package=$b"
            if ($a -ne $b) { throw "$n differs from the package directory copy" }
          }

          $stamped = 'Guest\Windows\FluxIdd\ARM64\Debug\FluxIdd.inf'
          if (Test-Path $stamped) {
            $h1 = (Get-FileHash $stamped -Algorithm SHA256).Hash
            $h2 = (Get-FileHash $inf -Algorithm SHA256).Hash
            Write-Host "stamped INF=$h1 artifact INF=$h2"
            if ($h1 -ne $h2) { throw 'Artifact INF differs from the stamped INF used by Inf2Cat' }
          }

          $txt = Get-Content -LiteralPath $inf -Raw
          if ($txt -notmatch '(?im)^\s*Class\s*=\s*Display\s*$') { throw 'INF: Class=Display missing' }
          if ($txt -notmatch '(?im)^\s*ClassGuid\s*=\s*\{4D36E968-E325-11CE-BFC1-08002BE10318\}\s*$') { throw 'INF: ClassGuid mismatch' }
          if ($txt -notmatch 'ROOT\\FLUX_IDD') { throw 'INF: ROOT\FLUX_IDD missing' }
          if ($txt -notmatch '(?im)^\s*UmdfLibraryVersion\s*=\s*2\.25\.0\s*$') { throw 'INF: UmdfLibraryVersion=2.25.0 missing' }
          if ($txt.Contains('$UMDFVERSION$')) { throw 'INF still contains $UMDFVERSION$ (unstamped)' }

          $m = [regex]::Match($txt, '(?im)^\s*DriverVer\s*=\s*(\S+)\s*$')
          if (-not $m.Success) { throw 'INF: DriverVer missing' }
          Write-Host "Packaged DriverVer: $($m.Groups[1].Value)"
          if ($m.Groups[1].Value -eq '09/28/2026,0.1.0.0') {
            throw 'Source (unstamped) DriverVer was packaged'
          }

          $infVerif = Find-Tool 'infverif.exe'
          Run-Strict 'InfVerif artifact INF' $infVerif @('/v', $inf)

          $b = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host ('DLL PE machine: 0x{0:X4}' -f $machine)
          if ($machine -ne 0xAA64) { throw 'DLL is not ARM64' }

          $sDll = Get-AuthenticodeSignature -FilePath $dll
          $sCat = Get-AuthenticodeSignature -FilePath $cat
          Write-Host "DLL signer: $($sDll.SignerCertificate.Thumbprint) $($sDll.SignerCertificate.Subject)"
          Write-Host "CAT signer: $($sCat.SignerCertificate.Thumbprint) $($sCat.SignerCertificate.Subject)"

          if (-not $sDll.SignerCertificate -or -not $sCat.SignerCertificate) {
            throw 'DLL or CAT is not signed'
          }

          if ($sDll.SignerCertificate.Thumbprint -ne $sCat.SignerCertificate.Thumbprint) {
            throw 'DLL and CAT signers differ'
          }

          $signer = $sDll.SignerCertificate
          if ($signer.Subject -notmatch 'WDKTestCert') {
            throw "Unexpected package signer subject: $($signer.Subject)"
          }
          if ($signer.Subject -ne $signer.Issuer) {
            throw "WDK test certificate is not self-signed: Subject=$($signer.Subject) Issuer=$($signer.Issuer)"
          }

          $rootStore = 'Cert:\CurrentUser\Root'
          $tempCert = Join-Path $env:RUNNER_TEMP "FluxIdd-WDKTestCert-$($signer.Thumbprint).cer"
          $existingRoot = @(Get-ChildItem -Path $rootStore | Where-Object { $_.Thumbprint -eq $signer.Thumbprint })
          $temporaryRootTrustAdded = $false

          try {
            [System.IO.File]::WriteAllBytes(
              $tempCert,
              $signer.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

            if ($existingRoot.Count -eq 0) {
              Import-Certificate -FilePath $tempCert -CertStoreLocation $rootStore -ErrorAction Stop | Out-Null
              $temporaryRootTrustAdded = $true
              Write-Host "Temporarily trusted WDK test certificate in CurrentUser\\Root: $($signer.Thumbprint)"
            } else {
              Write-Host "WDK test certificate already trusted in CurrentUser\\Root: $($signer.Thumbprint)"
            }

            $signtool = Find-Tool 'signtool.exe'
            Run-Strict 'signtool verify DLL' $signtool @('verify','/v','/pa',$dll)
            Run-Strict 'signtool verify CAT' $signtool @('verify','/v','/pa',$cat)
            Run-Strict 'catalog membership DLL' $signtool @('verify','/v','/pa','/c',$cat,$dll)
            Run-Strict 'catalog membership INF' $signtool @('verify','/v','/pa','/c',$cat,$inf)
          } finally {
            if ($temporaryRootTrustAdded) {
              Remove-Item -LiteralPath (Join-Path $rootStore $signer.Thumbprint) -Force -ErrorAction Stop
              Write-Host "Removed temporary WDK test certificate from CurrentUser\\Root: $($signer.Thumbprint)"
            }
            Remove-Item -LiteralPath $tempCert -Force -ErrorAction SilentlyContinue
          }

          Write-Host 'PACKAGE COHERENCE: PASS'
      - name: Upload ARM64 Debug driver artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluxIdd-ARM64-Debug
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .artifacts/FluxIdd/**
            .artifacts/Tools/**
